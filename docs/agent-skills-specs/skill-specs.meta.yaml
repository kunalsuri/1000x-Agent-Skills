canonical_schema:
  top_level_allowed_properties:
    - name
    - description
    - license
    - compatibility
    - metadata
    - allowed-tools

  strict_packaging_rule: >
    Upstream packaging tools (such as package_skill.py and claude.ai skill uploads)
    strictly reject unexpected top-level frontmatter keys. Any custom properties
    (e.g., version, author, tags) MUST be placed under 'metadata' to maintain
    universal cross-platform portability.

  field_rules:
    name:
      type: "string"
      required: true
      min_length: 1
      max_length: 64
      regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
      constraints:
        - "Lowercase alphanumeric ('a-z', '0-9') and hyphens ('-') only"
        - "Must not start or end with a hyphen"
        - "Must not contain consecutive hyphens"
        - "Must strictly match the parent directory name"

    description:
      type: "string"
      required: true
      min_length: 1
      max_length: 1024
      constraints:
        - "Non-empty string"
        - "Must describe what the skill does and when the agent must trigger it"
        - "Should use imperative phrasing ('Use when...') and include domain keywords"

    license:
      type: "string"
      required: false
      constraints:
        - "Short license name, SPDX identifier (e.g., Apache-2.0, MIT), or reference to bundled license file"

    compatibility:
      type: "string"
      required: false
      max_length: 500
      constraints:
        - "Freeform string describing environment prerequisites, required system packages, or network access"
        - "MUST be a string, NOT a YAML list/array"

    metadata:
      type: "map[string]string"
      required: false
      constraints:
        - "Key-value mapping where keys and values are strings"
        - "Designated official location for author, version, tags, and client-specific attributes"

    allowed-tools:
      type: "string"
      required: false
      format: "space-separated string"
      status: "experimental"
      constraints:
        - "Space-separated string of pre-approved tool patterns (e.g. 'Bash(git:*) Bash(jq:*) Read')"
        - "Note: Claude Code also accepts YAML list format for local skills"

directory_structure_standard:
  required_files:
    - path: "SKILL.md"
      description: "Metadata frontmatter followed by procedural markdown workflow"
  optional_directories:
    - path: "scripts/"
      description: "Executable code (Bash, Python, JS) executed on-demand by agent"
    - path: "references/"
      description: "Deep documentation, API schemas, and reference material loaded on-demand"
    - path: "assets/"
      description: "Static resources (templates, images, lookup tables, diagrams)"
    - path: "evals/"
      description: "Standard evaluation datasets (evals/evals.json)"

repository_profile_extensions:
  attestation:
    file: "attestation.json"
    schema: "docs/schemas/attestation.schema.json"
    purpose: "Cryptographic content-binding, capability boundary declaration, and multi-model test proof"
    is_universal_standard: false
    scope: "1000x-Agent-Skills internal governance"
  eval_harness:
    file: "evals/test-cases.json"
    validator: "scripts/validate_skills.py"
    purpose: "Trigger evaluation test harness for automated repository validation"
    upstream_standard_counterpart: "evals/evals.json"
  catalog_hierarchy:
    pattern: "skills/<skill-name>/"
    changed: "2026-10-31: flattened from skills/<category>/<skill-name>/ to match anthropics/skills, the Claude Code plugin layout and npx skills discovery"
    mirror: ".agents/skills/<skill-name>/ (byte-identical; scripts/sync_mirror.py)"

verification_checklist:
  - id: "CHK-01"
    check: "Validate that SKILL.md frontmatter adheres to the 6 canonical top-level fields or isolates extensions to metadata."
  - id: "CHK-02"
    check: "Ensure compatibility field is a string <= 500 characters, not a list."
  - id: "CHK-03"
    check: "Ensure skill name strictly matches ^[a-z0-9]+(-[a-z0-9]+)*$ and matches directory name."
  - id: "CHK-04"
    check: "Verify SKILL.md body line count is under 500 lines."
  - id: "CHK-05"
    check: "Verify frontmatter estimated token footprint is <= 150 tokens (repository heuristic, not an upstream rule)."
  - id: "CHK-06"
    check: "Confirm externalized code and templates use scripts/ and assets/ conventions."
  - id: "CHK-07"
    check: "Ensure attestation.json and evals/test-cases.json are maintained for repository catalog skills."
