canonical_schema:
  top_level_allowed_properties:
    - name
    - description
    - license
    - compatibility
    - metadata
    - allowed-tools

  strict_packaging_rule: >
    Upstream packaging tools (such as package_skill.py and claude.ai skill uploads)
    strictly reject unexpected top-level frontmatter keys. Any custom properties
    (e.g., version, author, tags) MUST be placed under 'metadata' to maintain
    universal cross-platform portability.

  field_rules:
    name:
      type: "string"
      required: true
      min_length: 1
      max_length: 64
      regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
      constraints:
        - "Lowercase alphanumeric ('a-z', '0-9') and hyphens ('-') only"
        - "Must not start or end with a hyphen"
        - "Must not contain consecutive hyphens"
        - "Must strictly match the parent directory name"

    description:
      type: "string"
      required: true
      min_length: 1
      max_length: 1024
      constraints:
        - "Non-empty string"
        - "Must describe what the skill does and when the agent must trigger it"
        - "Should use imperative phrasing ('Use when...') and include domain keywords"

    license:
      type: "string"
      required: false
      constraints:
        - "Short license name, SPDX identifier (e.g., Apache-2.0, MIT), or reference to bundled license file"

    compatibility:
      type: "string"
      required: false
      max_length: 500
      constraints:
        - "Freeform string describing environment prerequisites, required system packages, or network access"
        - "MUST be a string, NOT a YAML list/array"

    metadata:
      type: "map[string]string"
      required: false
      constraints:
        - "Key-value mapping where keys and values are strings"
        - "Designated official location for author, version, tags, and client-specific attributes"

    allowed-tools:
      type: "string"
      required: false
      format: "space-separated string"
      status: "experimental"
      constraints:
        - "Space-separated string of pre-approved tool patterns (e.g. 'Bash(git:*) Bash(jq:*) Read')"
        - "Note: Claude Code also accepts YAML list format for local skills"

directory_structure_standard:
  required_files:
    - path: "SKILL.md"
      description: "Metadata frontmatter followed by procedural markdown workflow"
  optional_directories:
    - path: "scripts/"
      description: "Executable code (Bash, Python, JS) executed on-demand by agent"
    - path: "references/"
      description: "Deep documentation, API schemas, and reference material loaded on-demand"
    - path: "assets/"
      description: "Static resources (templates, images, lookup tables, diagrams)"
    - path: "evals/"
      description: "Standard evaluation datasets (evals/evals.json)"

