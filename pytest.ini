[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test* *Suite
python_functions = test_*
addopts = -ra -q --strict-markers --strict-config
markers =
    unit: Fast, deterministic unit tests isolated from external dependencies
    integration: Multi-module or service-boundary integration tests
    smoke: Pre-flight sanity tests verifying environment & importability
    slow: Tests requiring extended execution time
